[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexaform"
version = "0.2.0"
description = "Structured all-hexahedral meshing for natural-shaped inclusions, with native Exodus II output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mesh generation", "hexahedral", "exodus", "finite element",
    "phase-field fracture", "microstructure", "RVE", "cubed sphere",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
exodus = ["netCDF4>=1.6"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27"]
all = [
    "netCDF4>=1.6", "fastapi>=0.110", "uvicorn[standard]>=0.27",
    "PyYAML>=6.0", "pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27",
]

[project.scripts]
hexaform = "hexaform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hexaform = ["server/static/*.html", "server/static/*.css", "server/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
